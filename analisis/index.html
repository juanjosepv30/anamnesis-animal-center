<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análisis — Animal Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf7ff;--bg2:#f3eeff;--tx:#1a0a2e;--tm:#6b5c7e;--ts:#b0a4bf;
  --wh:#fff;--bd:#e8dff5;--p:#7c3aed;--pl:#f5f0ff;--pd:#5b21b6;--ok:#16a34a;--warn:#dc2626;
}
html,body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}

.hdr{background:var(--wh);border-bottom:1px solid var(--bd);padding:0 22px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.hdr-brand{display:flex;align-items:center;gap:10px}
.hdr-icon{width:34px;height:34px;border-radius:8px;overflow:hidden;background:var(--p);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.1rem}
.hdr-t{font-size:.95rem;font-weight:700}
.hdr-s{font-size:.72rem;color:var(--tm)}
.btn-ref{border:1.5px solid var(--bd);border-radius:8px;padding:6px 14px;color:var(--tm);font-size:.78rem;font-weight:600;cursor:pointer;background:var(--wh);font-family:'DM Sans',sans-serif}

.wrap{max-width:920px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--wh);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px}
.card-t{font-size:1rem;font-weight:800;margin-bottom:2px}
.card-sub{font-size:.8rem;color:var(--tm);margin-bottom:14px}

/* Filtros con desplegables */
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.filtro label{display:block;font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--tm);margin-bottom:5px}
.filtro select{width:100%;border:1.5px solid var(--bd);border-radius:9px;padding:9px 11px;font-family:inherit;font-size:.86rem;font-weight:600;color:var(--tx);background:var(--wh);outline:none;cursor:pointer}
.filtro select:focus{border-color:var(--p)}

/* KPIs compactos */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi{background:var(--pl);border-radius:11px;padding:13px 14px}
.kpi-n{font-size:1.5rem;font-weight:800;color:var(--pd);line-height:1}
.kpi-l{font-size:.7rem;color:var(--tm);margin-top:5px;font-weight:600}

/* Tabla compacta */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl th{text-align:right;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--tm);padding:8px 10px;border-bottom:2px solid var(--bd);white-space:nowrap}
.tbl th:first-child{text-align:left}
.tbl td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--bg2);white-space:nowrap}
.tbl td:first-child{text-align:left;font-weight:700}
.tbl tbody tr:hover{background:var(--pl)}
.tbl .big{font-weight:800;color:var(--pd);font-size:.95rem}
.tbl .mut{color:var(--ts)}
.tbl-foot td{font-weight:800;border-top:2px solid var(--bd);border-bottom:none;background:var(--bg2)}

/* Listas compactas (por servicio / por médico) */
.lst-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bg2)}
.lst-item:last-child{border-bottom:none}
.lst-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.lst-name{flex:1;font-weight:700;font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lst-val{font-weight:800;font-size:.9rem}
.lst-sub{font-size:.74rem;color:var(--ts);font-weight:600;margin-left:6px}
.pill{display:inline-block;background:#f3e7f7;color:#6d2f7a;border-radius:8px;padding:2px 8px;font-size:.72rem;font-weight:700;margin:2px 3px 2px 0}

.dos-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.dos-col{grid-template-columns:1fr}}

.empty{text-align:center;padding:26px 20px;color:var(--tm);font-size:.85rem}
.spinner{width:30px;height:30px;border:2.5px solid var(--bd);border-top-color:var(--p);border-radius:50%;animation:spin .7s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.note{font-size:.72rem;color:var(--ts);margin-top:10px}

/* ── Comisiones (admin) ── */
.com-lockrow{display:flex;gap:8px;align-items:center;margin-top:8px}
.com-pin-in{flex:0 0 130px;border:1.5px solid var(--bd);border-radius:9px;padding:10px 12px;font-family:inherit;font-size:1.15rem;font-weight:700;text-align:center;letter-spacing:.35em;color:var(--tx);background:var(--wh);outline:none}
.com-pin-in:focus{border-color:var(--p)}
.com-btn-p{border:none;border-radius:9px;padding:10px 18px;background:var(--p);color:#fff;font-weight:700;font-size:.86rem;font-family:inherit;cursor:pointer}
.com-btn-g{border:1.5px solid var(--bd);border-radius:9px;padding:9px 14px;background:var(--wh);color:var(--tm);font-weight:700;font-size:.8rem;font-family:inherit;cursor:pointer}
.com-err{font-size:.78rem;color:var(--warn);min-height:1em;margin-top:6px}
.com-toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.com-toolbar .filtro{flex:1 1 150px}
.com-badge{display:inline-block;background:var(--p);color:#fff;border-radius:6px;padding:1px 7px;font-size:.66rem;font-weight:800;margin-left:5px;vertical-align:middle}
.com-svc{font-size:.74rem;color:var(--ts);font-weight:600;margin-top:3px;white-space:normal;line-height:1.35}
.com-sub-t{font-size:.9rem;font-weight:800;margin-bottom:6px}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-brand">
    <div class="hdr-icon">📊</div>
    <div><div class="hdr-t">Análisis</div><div class="hdr-s">Animal Center</div></div>
  </div>
  <button class="btn-ref" onclick="cargar();cargarResenas()">↻ Actualizar</button>
</div>

<div class="wrap">
  <!-- Comisiones (admin) — protegido con clave -->
  <div class="card" id="comAdminCard">
    <div class="card-t">💰 Comisiones <span style="font-weight:600;color:var(--tm);font-size:.78rem">· administración</span></div>
    <div id="comAdminBody"><div class="spinner"></div></div>
  </div>

  <!-- 1. Reseñas primero -->
  <div id="resenas"><div class="card"><div class="spinner"></div></div></div>

  <!-- 2. Filtros -->
  <div class="card">
    <div class="card-t">🎛️ Filtros</div>
    <div class="card-sub">Elija médico, servicio y período. Todo lo de abajo se recalcula solo.</div>
    <div class="filtros">
      <div class="filtro"><label>Médico</label><select id="fMed" onchange="render()"></select></div>
      <div class="filtro"><label>Servicio</label><select id="fSvc" onchange="render()"></select></div>
      <div class="filtro"><label>Período</label><select id="fRango" onchange="render()">
        <option value="7">Últimos 7 días</option>
        <option value="30" selected>Últimos 30 días</option>
        <option value="90">Últimos 3 meses</option>
        <option value="365">Últimos 12 meses</option>
        <option value="0">Todo</option>
      </select></div>
      <div class="filtro"><label>Agrupar por</label><select id="fGran" onchange="render()">
        <option value="dia" selected>Día</option>
        <option value="semana">Semana</option>
        <option value="mes">Mes</option>
      </select></div>
    </div>
  </div>

  <div id="contenido"><div class="card"><div class="spinner"></div></div></div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbx61iNPH-W-UJLzDX4rC1_NJckbQb-ZVlkzuY27cZRRBbVwsae9QAAJvfysla7e_DSU/exec';

var STATS = [];   // datos crudos del backend (cada uno con _d = Date y _svc = servicio normalizado)

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

// ── Normalización de nombres de servicio ─────────────────────
// La data histórica tiene variantes del mismo servicio ("Control" suelto vs
// "Control general", "Ecocardiograma" vs "Ecocardiograma / Electrocardiograma").
// Las unificamos a un nombre canónico para que no aparezcan duplicadas.
function normSvc(raw){
  var s=(raw||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
  if(!s) return 'Sin servicio';
  if(s.indexOf('cardiograma')!==-1||s.indexOf('electro')!==-1) return 'Ecocardiograma / Electrocardiograma';
  if(s.indexOf('rayos')!==-1||s.indexOf('ecograf')!==-1) return 'Rayos X y Ecografía';
  if(s.indexOf('terapia')!==-1||s.indexOf('fisica')!==-1) return 'Terapia física';
  if(s.indexOf('cirug')!==-1) return 'Cirugía';
  if(s.indexOf('viaje')!==-1) return 'Certificado de viaje';
  if(s.indexOf('vacun')!==-1) return 'Vacunación';
  if(s.indexOf('inyect')!==-1) return 'Inyectología';
  if(s.indexOf('desparasit')!==-1) return 'Desparasitación';
  if(s.indexOf('control')!==-1) return (s.indexOf('especial')!==-1) ? 'Control especializado' : 'Control general';
  if(s.indexOf('consulta')!==-1) return (s.indexOf('especial')!==-1) ? 'Consulta especializada' : 'Consulta general';
  if(s.indexOf('especial')!==-1) return 'Consulta especializada';
  return raw;   // algo raro: se muestra tal cual (mejor que perderlo)
}
function colorSvc(canon){
  var s=(canon||'').toLowerCase();
  if(s.indexOf('cardiograma')!==-1) return '#e11d48';
  if(s.indexOf('control')!==-1)   return (s.indexOf('especial')!==-1)?'#4f46e5':'#2563eb';
  if(s.indexOf('cirug')!==-1)     return '#7c3aed';
  if(s.indexOf('terapia')!==-1)   return '#14b8a6';
  if(s.indexOf('rayos')!==-1)     return '#eab308';
  if(s.indexOf('especial')!==-1)  return '#f97316';
  if(s.indexOf('vacun')!==-1)     return '#ec4899';
  if(s.indexOf('inyect')!==-1||s.indexOf('desparasit')!==-1) return '#6b7280';
  if(s.indexOf('viaje')!==-1)     return '#0891b2';
  if(s.indexOf('consulta')!==-1||s.indexOf('general')!==-1) return '#16a34a';
  return '#94a3b8';
}

// ── Buckets de tiempo ────────────────────────────────────────
var MES_A=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
var DIAS_A=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
function semanaISO(d){
  var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  var dn=(t.getUTCDay()+6)%7; t.setUTCDate(t.getUTCDate()-dn+3);
  var f=new Date(Date.UTC(t.getUTCFullYear(),0,4));
  return 1+Math.round(((t-f)/86400000-3+((f.getUTCDay()+6)%7))/7);
}
function bucket(d, g){
  var y=d.getFullYear(), m=d.getMonth(), day=d.getDate();
  if(g==='mes')    return {k:y+'-'+String(m+1).padStart(2,'0'), lbl:MES_A[m]+" '"+String(y).slice(2)};
  if(g==='semana'){
    var t=new Date(d); var dow=(t.getDay()+6)%7; t.setDate(t.getDate()-dow);
    return {k:t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'),
            lbl:'Sem '+semanaISO(t)+" · "+t.getDate()+' '+MES_A[t.getMonth()]};
  }
  return {k:y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0'), lbl:DIAS_A[d.getDay()]+' '+day+' '+MES_A[m]};
}
function enRango(d, dias){
  if(!dias) return true;
  var lim=new Date(); lim.setHours(0,0,0,0); lim.setDate(lim.getDate()-dias);
  return d>=lim;
}

// ── Carga ────────────────────────────────────────────────────
function cargar(){
  document.getElementById('contenido').innerHTML='<div class="card"><div class="spinner"></div></div>';
  fetch(API_URL+'?action=stats&cb='+Date.now()).then(function(r){return r.json();}).then(function(res){
    if(!res||!res.ok){ document.getElementById('contenido').innerHTML='<div class="card"><div class="empty">No se pudo cargar.</div></div>'; return; }
    STATS=(res.data||[]).map(function(x){ x._d=new Date(x.t); x._svc=normSvc(x.svc); return x; }).filter(function(x){ return !isNaN(x._d); });
    llenarFiltros();
    render();
  }).catch(function(){ document.getElementById('contenido').innerHTML='<div class="card"><div class="empty">Error de conexión.</div></div>'; });
}

// Poblar los desplegables de médico y servicio con lo que hay en la data.
function llenarFiltros(){
  var meds={}, svcs={};
  STATS.forEach(function(x){ if(x.med) meds[x.med]=(meds[x.med]||0)+1; svcs[x._svc]=(svcs[x._svc]||0)+1; });
  var med=document.getElementById('fMed'), svc=document.getElementById('fSvc');
  var medPrev=med.value, svcPrev=svc.value;
  med.innerHTML='<option value="">Todos los médicos</option>'+
    Object.keys(meds).sort().map(function(m){return '<option value="'+esc(m)+'">'+esc(m)+'</option>';}).join('');
  svc.innerHTML='<option value="">Todos los servicios</option>'+
    Object.keys(svcs).sort().map(function(s){return '<option value="'+esc(s)+'">'+esc(s)+'</option>';}).join('');
  if(medPrev) med.value=medPrev;
  if(svcPrev) svc.value=svcPrev;
}

function filtrados(){
  var med=document.getElementById('fMed').value;
  var svc=document.getElementById('fSvc').value;
  var dias=+document.getElementById('fRango').value;
  return STATS.filter(function(x){
    if(!enRango(x._d, dias)) return false;
    if(med && x.med!==med) return false;
    if(svc && x._svc!==svc) return false;
    return true;
  });
}

function prom(arr, campo){
  var v=arr.filter(function(x){return x[campo]!=null;});
  return v.length ? Math.round(v.reduce(function(a,x){return a+x[campo];},0)/v.length) : null;
}

function render(){
  if(!STATS.length){
    document.getElementById('contenido').innerHTML='<div class="card"><div class="empty">Todavía no hay datos para analizar.<br>A medida que registre pacientes va a ver acá cómo se mueve la clínica.</div></div>';
    return;
  }
  var rows=filtrados();
  var gran=document.getElementById('fGran').value;
  document.getElementById('contenido').innerHTML =
    kpisHtml(rows) +
    tablaPeriodoHtml(rows, gran) +
    '<div class="dos-col">'+ porServicioHtml(rows) + porMedicoHtml(rows) +'</div>';
}

// ── KPIs ─────────────────────────────────────────────────────
function kpisHtml(rows){
  var aten=rows.filter(function(x){return x.est==='atendido';}).length;
  var total=rows.length;
  var esp=prom(rows,'wait'), con=prom(rows,'aten');
  var aus=rows.filter(function(x){return x.est==='ausente';}).length;
  var tasaAus=total?Math.round(aus/total*100):0;
  return '<div class="card"><div class="kpis">'+
    kpi(aten, 'atendidos')+
    kpi(esp==null?'—':esp+"'", 'espera promedio')+
    kpi(con==null?'—':con+"'", 'consulta promedio')+
    kpi(tasaAus+'%', 'ausentes ('+aus+')')+
  '</div></div>';
}
function kpi(n,l){ return '<div class="kpi"><div class="kpi-n">'+esc(n)+'</div><div class="kpi-l">'+esc(l)+'</div></div>'; }

// ── Tabla por período (día/semana/mes) ───────────────────────
// La vista principal: cuántos se atendieron por período, con espera y consulta
// promedio. Filtrada por el médico y servicio elegidos. Más reciente arriba.
function tablaPeriodoHtml(rows, gran){
  var b={}, orden=[];
  rows.forEach(function(x){
    var bk=bucket(x._d, gran);
    if(!(bk.k in b)){ b[bk.k]={lbl:bk.lbl, aten:0, total:0, aus:0, espN:0,espS:0, conN:0,conS:0}; orden.push(bk.k); }
    var o=b[bk.k]; o.total++;
    if(x.est==='atendido') o.aten++;
    if(x.est==='ausente')  o.aus++;
    if(x.wait!=null){ o.espN++; o.espS+=x.wait; }
    if(x.aten!=null){ o.conN++; o.conS+=x.aten; }
  });
  orden.sort(); orden.reverse();   // más reciente primero
  if(!orden.length) return '<div class="card"><div class="card-t">📅 Por '+etiquetaGran(gran)+'</div><div class="empty">Sin pacientes con estos filtros.</div></div>';

  var totA=0,totT=0,totAus=0;
  var body=orden.map(function(k){
    var o=b[k]; totA+=o.aten; totT+=o.total; totAus+=o.aus;
    var esp=o.espN?Math.round(o.espS/o.espN):null;
    var con=o.conN?Math.round(o.conS/o.conN):null;
    return '<tr><td>'+esc(o.lbl)+'</td>'+
      '<td class="big">'+o.aten+'</td>'+
      '<td>'+(esp==null?'<span class="mut">—</span>':esp+"'")+'</td>'+
      '<td>'+(con==null?'<span class="mut">—</span>':con+"'")+'</td>'+
      '<td>'+(o.aus?o.aus:'<span class="mut">0</span>')+'</td></tr>';
  }).join('');

  return '<div class="card"><div class="card-t">📅 Por '+etiquetaGran(gran)+'</div>'+
    '<div class="card-sub">Atendidos por período, con espera y consulta promedio. Toque los filtros de arriba para ver un médico o servicio puntual.</div>'+
    '<div class="tbl-wrap"><table class="tbl"><thead><tr>'+
      '<th>'+etiquetaGran(gran)+'</th><th>Atendidos</th><th>Espera</th><th>Consulta</th><th>Ausentes</th>'+
    '</tr></thead><tbody>'+body+'</tbody>'+
    '<tfoot class="tbl-foot"><tr><td>Total</td><td class="big">'+totA+'</td><td colspan="2" class="mut" style="text-align:right">'+totT+' pacientes</td><td>'+totAus+'</td></tr></tfoot>'+
    '</table></div></div>';
}
function etiquetaGran(g){ return g==='mes'?'Mes':(g==='semana'?'Semana':'Día'); }

// ── Por servicio (lista compacta) ────────────────────────────
function porServicioHtml(rows){
  var c={};
  rows.forEach(function(x){ var s=x._svc; if(!c[s])c[s]={n:0,aten:0,aus:0}; c[s].n++; if(x.est==='atendido')c[s].aten++; if(x.est==='ausente')c[s].aus++; });
  var svcs=Object.keys(c).sort(function(a,b){return c[b].aten-c[a].aten;});
  if(!svcs.length) return '<div class="card"><div class="card-t">🩺 Por servicio</div><div class="empty">Sin datos.</div></div>';
  var max=1; svcs.forEach(function(s){ if(c[s].aten>max)max=c[s].aten; });
  var items=svcs.map(function(s){
    var ausTxt=c[s].aus?'<span class="lst-sub">'+c[s].aus+' aus.</span>':'';
    return '<div class="lst-item"><span class="lst-dot" style="background:'+colorSvc(s)+'"></span>'+
      '<span class="lst-name">'+esc(s)+'</span>'+
      '<span class="lst-val">'+c[s].aten+'</span>'+ausTxt+'</div>';
  }).join('');
  return '<div class="card"><div class="card-t">🩺 Por servicio</div>'+
    '<div class="card-sub">Atendidos por servicio (con el filtro actual).</div>'+items+'</div>';
}

// ── Por médico (lista compacta) ──────────────────────────────
function porMedicoHtml(rows){
  var c={};
  rows.forEach(function(x){ if(x.est!=='atendido'||!x.med)return; var m=x.med; if(!c[m])c[m]={aten:0,conN:0,conS:0}; c[m].aten++; if(x.aten!=null){c[m].conN++;c[m].conS+=x.aten;} });
  var meds=Object.keys(c).sort(function(a,b){return c[b].aten-c[a].aten;});
  if(!meds.length) return '<div class="card"><div class="card-t">👨‍⚕️ Por médico</div><div class="empty">Sin atenciones con estos filtros.</div></div>';
  var items=meds.map(function(m,i){
    var con=c[m].conN?Math.round(c[m].conS/c[m].conN):null;
    var conTxt=con!=null?'<span class="lst-sub">'+con+"' c/u</span>":'';
    return '<div class="lst-item"><span class="lst-dot" style="background:'+medColor(i)+'"></span>'+
      '<span class="lst-name">'+esc(m)+'</span>'+
      '<span class="lst-val">'+c[m].aten+'</span>'+conTxt+'</div>';
  }).join('');
  return '<div class="card"><div class="card-t">👨‍⚕️ Por médico</div>'+
    '<div class="card-sub">Atendidos por médico (con el filtro actual).</div>'+items+'</div>';
}
function medColor(i){ return ['#8e3f9e','#2563eb','#16a34a','#f97316','#e11d48','#0891b2','#eab308','#14b8a6','#4f46e5','#ec4899'][i%10]; }

// ── Reseñas (arriba de todo) ─────────────────────────────────
function estrellasHtml(n, size){
  var full=Math.round(n), s='';
  for(var i=1;i<=5;i++) s+='<span style="color:'+(i<=full?'#f5b301':'#e2d3ec')+';font-size:'+(size||'1rem')+'">★</span>';
  return s;
}
function cargarResenas(){
  var el=document.getElementById('resenas');
  fetch(API_URL+'?action=resenas&cb='+Date.now()).then(function(r){return r.json();}).then(function(res){
    if(!res||!res.ok){ el.innerHTML=''; return; }
    if(!res.total){
      el.innerHTML='<div class="card"><div class="card-t">⭐ Reseñas de clientes</div><div class="empty">Todavía no hay reseñas. Aparecen cuando los clientes califican su visita.</div></div>';
      return;
    }
    var prom=res.promedio||0;
    var html='<div class="card"><div class="card-t">⭐ Reseñas de clientes</div>'+
      '<div style="display:flex;align-items:center;gap:16px;margin:10px 0 16px">'+
        '<div style="font-size:2.6rem;font-weight:800;color:#8e3f9e;line-height:1">'+prom.toFixed(1)+'</div>'+
        '<div><div>'+estrellasHtml(prom,'1.4rem')+'</div>'+
        '<div style="font-size:.82rem;color:#7d6d86;margin-top:2px">'+res.total+' reseña'+(res.total===1?'':'s')+'</div></div>'+
      '</div>';
    var meds=res.porMedico||[];
    if(meds.length){
      html+='<div style="font-weight:700;font-size:.85rem;margin-bottom:4px">Por médico</div>';
      meds.forEach(function(m){
        html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f0e8f5;font-size:.88rem">'+
          '<span>'+esc(m.medico||'—')+'</span>'+
          '<span style="white-space:nowrap">'+estrellasHtml(m.prom)+' <b>'+m.prom.toFixed(1)+'</b> <span style="color:#b8a8c2">('+m.n+')</span></span></div>';
      });
    }
    var coms=res.comentarios||[];
    if(coms.length){
      window._resenasComs=coms;
      var hoy=new Date().toLocaleDateString('en-CA');
      html+='<div style="font-weight:700;font-size:.85rem;margin:16px 0 6px">Comentarios por día</div>'+
        '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">'+
          '<input type="date" id="resFecha" value="'+hoy+'" onchange="pintarComentarios()" style="border:1.5px solid #e8daf0;border-radius:9px;padding:7px 10px;font-family:inherit;font-size:.85rem;color:#3a2140;background:#faf5fc;outline:none">'+
          '<button onclick="document.getElementById(\'resFecha\').value=\'\';pintarComentarios()" style="border:1.5px solid #e8daf0;background:#fff;color:#6d2f7a;font-weight:700;font-size:.8rem;font-family:inherit;border-radius:9px;padding:7px 13px;cursor:pointer">Ver todas</button>'+
        '</div><div id="resComs"></div>';
    }
    html+='</div>';
    el.innerHTML=html;
    if(coms.length) pintarComentarios();
  }).catch(function(){ el.innerHTML=''; });
}
function fmtFechaCorta(iso){ var d=new Date(iso); if(isNaN(d))return''; return d.toLocaleDateString('es-CO',{day:'numeric',month:'short'}); }
function pintarComentarios(){
  var coms=window._resenasComs||[];
  var cont=document.getElementById('resComs'); if(!cont) return;
  var f=(document.getElementById('resFecha')||{}).value||'';
  var lista=f ? coms.filter(function(x){ return new Date(x.fecha).toLocaleDateString('en-CA')===f; }) : coms;
  if(!lista.length){ cont.innerHTML='<div style="color:#b8a8c2;font-size:.85rem;padding:6px 0">Sin comentarios '+(f?'ese día':'')+'.</div>'; return; }
  var html='<div style="color:#b8a8c2;font-size:.78rem;margin-bottom:6px">'+lista.length+' comentario'+(lista.length===1?'':'s')+(f?'':' — todos')+'</div>';
  lista.forEach(function(x){
    html+='<div style="background:#faf5fc;border-radius:10px;padding:10px 12px;margin-bottom:8px">'+
      '<div style="font-size:.85rem">'+estrellasHtml(x.estrellas)+' <span style="color:#7d6d86;font-size:.78rem">'+esc(x.medico||'')+(x.turno?' · '+esc(x.turno):'')+' · '+fmtFechaCorta(x.fecha)+'</span></div>'+
      '<div style="margin-top:3px;font-size:.9rem;line-height:1.4">'+esc(x.comentario)+'</div></div>';
  });
  cont.innerHTML=html;
}

// ============================================================
//  COMISIONES — perfil administrativo (ve TODO, con clave admin)
//  Reusa el backend seguro: comLogin(rol=admin) + comListar(rol=admin).
//  El token viaja en sessionStorage (por-pestaña); sin clave no sale nada.
// ============================================================
var COM_ADMIN = null;      // { token, ts }
var COM_ENTRIES = [];      // todos los registros que devuelve el backend
var comFiltroMed = '', comFiltroRango = '0';
try { COM_ADMIN = JSON.parse(sessionStorage.getItem('ac_com_admin') || 'null'); } catch (e) {}

function comAdminSet(s){ COM_ADMIN = s || null; try { s ? sessionStorage.setItem('ac_com_admin', JSON.stringify(s)) : sessionStorage.removeItem('ac_com_admin'); } catch (e) {} }
function comPost(body){ return fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) }).then(function(r){return r.json();}); }
function comFmt(n){ return '$' + (Math.round(n) || 0).toLocaleString('es-CO'); }

function comAdminInit(){ if (COM_ADMIN && COM_ADMIN.token) comAdminCargar(); else comAdminLockUI(); }

function comAdminLockUI(msg){
  document.getElementById('comAdminBody').innerHTML =
    '<div class="card-sub" style="margin-bottom:2px">Ingrese su clave de administrador para ver las comisiones de todos los médicos.</div>'+
    '<div class="com-lockrow">'+
      '<input class="com-pin-in" id="comAdminPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••" autocomplete="off" oninput="this.value=this.value.replace(/\\D/g,\'\').slice(0,4)" onkeydown="if(event.key===\'Enter\')comAdminLogin()">'+
      '<button class="com-btn-p" onclick="comAdminLogin()">Entrar</button>'+
    '</div>'+
    '<div class="com-err" id="comAdminErr">'+(msg?esc(msg):'')+'</div>';
  setTimeout(function(){ try { document.getElementById('comAdminPin').focus(); } catch (e) {} }, 50);
}
function comAdminLogin(){
  var el = document.getElementById('comAdminPin');
  var pass = ((el && el.value) || '').replace(/\D/g, '');
  var err = document.getElementById('comAdminErr');
  if (pass.length < 4) { err.textContent = 'La clave es de 4 dígitos.'; return; }
  err.textContent = 'Verificando…';
  comPost({ action:'comLogin', rol:'admin', pass:pass }).then(function(res){
    if (!res || !res.ok) { err.textContent = (res && res.error) || 'No se pudo.'; if (el) el.value = ''; return; }
    comAdminSet({ token:res.token, ts:Date.now() });
    comAdminCargar();
  }).catch(function(){ err.textContent = 'Error de conexión.'; });
}
function comAdminSalir(){ comAdminSet(null); COM_ENTRIES = []; comAdminLockUI(); }

function comAdminCargar(){
  document.getElementById('comAdminBody').innerHTML = '<div class="spinner"></div>';
  comPost({ action:'comListar', rol:'admin', doctorId:'', token:COM_ADMIN.token }).then(function(res){
    if (res && res.needLogin) { comAdminSet(null); comAdminLockUI('Sesión vencida, vuelva a entrar.'); return; }
    if (!res || !res.ok) { document.getElementById('comAdminBody').innerHTML = '<div class="empty">No se pudo cargar.</div>'; return; }
    COM_ENTRIES = res.entries || [];
    comAdminSet({ token:COM_ADMIN.token, ts:Date.now() });
    comAdminDash();
  }).catch(function(){ document.getElementById('comAdminBody').innerHTML = '<div class="empty">Error de conexión.</div>'; });
}

function comSetFiltro(campo, val){ if (campo === 'med') comFiltroMed = val; else comFiltroRango = val; comAdminDash(); }
function comAdminFiltradas(){
  var dias = +(comFiltroRango || '0'), lim = null;
  if (dias) { lim = new Date(); lim.setHours(0,0,0,0); lim.setDate(lim.getDate() - dias); }
  return COM_ENTRIES.filter(function(e){
    if (comFiltroMed && e.doctorId !== comFiltroMed) return false;
    if (lim) { var d = new Date(e.date || e.creada); if (isNaN(d) || d < lim) return false; }
    return true;
  });
}

function comAdminDash(){
  var rows = comAdminFiltradas();
  // Opciones de médico (de TODOS los registros, no de los filtrados).
  var medMap = {}; COM_ENTRIES.forEach(function(e){ if (e.doctorId) medMap[e.doctorId] = e.doctorName || e.doctorId; });
  var medOpts = '<option value="">Todos los médicos</option>' + Object.keys(medMap).map(function(id){ return '<option value="'+esc(id)+'"'+(comFiltroMed===id?' selected':'')+'>'+esc(medMap[id])+'</option>'; }).join('');
  var rangos = [['0','Todo'],['7','Últimos 7 días'],['30','Últimos 30 días'],['90','Últimos 3 meses'],['365','Últimos 12 meses']];
  var rangoOpts = rangos.map(function(r){ return '<option value="'+r[0]+'"'+(comFiltroRango===r[0]?' selected':'')+'>'+r[1]+'</option>'; }).join('');
  var toolbar = '<div class="com-toolbar">'+
    '<div class="filtro"><label>Médico</label><select onchange="comSetFiltro(\'med\',this.value)">'+medOpts+'</select></div>'+
    '<div class="filtro"><label>Período</label><select onchange="comSetFiltro(\'rango\',this.value)">'+rangoOpts+'</select></div>'+
    '<button class="com-btn-g" onclick="comAdminCargar()" title="Actualizar">↻</button>'+
    '<button class="com-btn-g" onclick="comAdminMedicos()">⚙️ Médicos</button>'+
    '<button class="com-btn-g" onclick="comAdminSalir()">🔒 Cerrar sesión</button>'+
  '</div>';

  var tv = 0, tc = 0, porMed = {}, porCat = {};
  rows.forEach(function(e){
    tv += e.totalVal || 0; tc += e.totalCom || 0;
    var m = e.doctorName || e.doctorId || '—';
    if (!porMed[m]) porMed[m] = { val:0, com:0, n:0 };
    porMed[m].val += e.totalVal || 0; porMed[m].com += e.totalCom || 0; porMed[m].n++;
    (e.items || []).forEach(function(it){ var c = it.cat || '—'; if (!porCat[c]) porCat[c] = { val:0, com:0, n:0 }; porCat[c].val += Number(it.val) || 0; porCat[c].com += Number(it.com) || 0; porCat[c].n++; });
  });

  var kpis = '<div class="kpis" style="margin-bottom:14px">'+
    '<div class="kpi"><div class="kpi-n">'+rows.length+'</div><div class="kpi-l">registros</div></div>'+
    '<div class="kpi"><div class="kpi-n">'+comFmt(tv)+'</div><div class="kpi-l">valor total</div></div>'+
    '<div class="kpi"><div class="kpi-n">'+comFmt(tc)+'</div><div class="kpi-l">comisión total</div></div>'+
  '</div>';

  var medLst = Object.keys(porMed).sort(function(a,b){ return porMed[b].com - porMed[a].com; }).map(function(m,i){
    return '<div class="lst-item"><span class="lst-dot" style="background:'+medColor(i)+'"></span><span class="lst-name">'+esc(m)+'</span><span class="lst-val">'+comFmt(porMed[m].com)+'</span><span class="lst-sub">'+porMed[m].n+' · '+comFmt(porMed[m].val)+'</span></div>';
  }).join('') || '<div class="empty">Sin registros.</div>';
  var catLst = Object.keys(porCat).sort(function(a,b){ return porCat[b].com - porCat[a].com; }).map(function(c){
    return '<div class="lst-item"><span class="lst-name">'+esc(c)+'</span><span class="lst-val">'+comFmt(porCat[c].com)+'</span><span class="lst-sub">'+porCat[c].n+' · '+comFmt(porCat[c].val)+'</span></div>';
  }).join('') || '<div class="empty">Sin servicios.</div>';
  var resumen = '<div class="dos-col" style="margin-bottom:14px">'+
    '<div><div class="com-sub-t">Por médico</div>'+medLst+'</div>'+
    '<div><div class="com-sub-t">Por categoría</div>'+catLst+'</div>'+
  '</div>';

  var ordenados = rows.slice().sort(function(a,b){ return String(b.creada || b.date).localeCompare(String(a.creada || a.date)); });
  var filas = ordenados.map(function(e){
    var svcs = (e.items || []).map(function(it){ return esc(it.desc || it.cat) + ' (' + comFmt(it.val) + ')'; }).join(' · ');
    return '<tr><td>'+esc(e.date || '')+'</td>'+
      '<td style="text-align:left">'+esc(e.doctorName || e.doctorId || '—')+'</td>'+
      '<td style="text-align:left">'+esc(e.patient || '—')+(e.turno?'<span class="com-badge">'+esc(e.turno)+'</span>':'')+(e.fact?' <span class="mut" style="font-weight:600">F '+esc(e.fact)+'</span>':'')+(svcs?'<div class="com-svc">'+svcs+'</div>':'')+'</td>'+
      '<td>'+comFmt(e.totalVal)+'</td>'+
      '<td class="big">'+comFmt(e.totalCom)+'</td></tr>';
  }).join('');
  var tabla = ordenados.length
    ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fecha</th><th style="text-align:left">Médico</th><th style="text-align:left">Paciente</th><th>Valor</th><th>Comisión</th></tr></thead><tbody>'+filas+'</tbody>'+
      '<tfoot class="tbl-foot"><tr><td>Total ('+ordenados.length+')</td><td colspan="2" class="mut" style="text-align:left"></td><td>'+comFmt(tv)+'</td><td class="big">'+comFmt(tc)+'</td></tr></tfoot></table></div>'
    : '<div class="empty">No hay registros con estos filtros.</div>';

  document.getElementById('comAdminBody').innerHTML = toolbar + kpis + resumen + tabla;
}

// ══════════ Gestión de médicos (admin) ══════════
var COM_MEDS = [], COM_CATSDEF = [], comMedCats = [], comMedI = -1, comMedEnc = false;
function comAdminMedicos(){
  document.getElementById('comAdminBody').innerHTML = '<div class="spinner"></div>';
  comPost({ action:'medAdminListar', token:COM_ADMIN.token }).then(function(res){
    if (res && res.needLogin) { comAdminSet(null); comAdminLockUI('Sesión vencida, vuelva a entrar.'); return; }
    if (!res || !res.ok) { document.getElementById('comAdminBody').innerHTML = '<div class="empty">No se pudo cargar.</div>'; return; }
    COM_MEDS = res.medicos || []; COM_CATSDEF = res.catsDefault || [];
    comMedRender();
  }).catch(function(){ document.getElementById('comAdminBody').innerHTML = '<div class="empty">Error de conexión.</div>'; });
}
function comMedRender(){
  var top = '<div class="com-toolbar">'+
    '<button class="com-btn-g" onclick="comAdminCargar()">← Comisiones</button>'+
    '<button class="com-btn-p" onclick="comMedFormNuevo()">＋ Agregar médico</button>'+
    '<button class="com-btn-g" onclick="comAdminMedicos()" title="Actualizar">↻</button>'+
  '</div><div id="comMedForm"></div>';
  var lst = COM_MEDS.map(function(m,i){
    var tags = (m.activo?'':'<span class="com-badge" style="background:#9ca3af">inactivo</span> ')+
      (m.comision?'<span class="com-badge">comisión'+(m.tieneClave?'':' · sin clave')+'</span>':'');
    return '<div class="lst-item" style="flex-wrap:wrap;align-items:flex-start">'+
      '<div style="flex:1;min-width:0"><div class="lst-name" style="white-space:normal">'+esc(m.medico)+' '+tags+'</div>'+
        '<div style="font-size:.72rem;color:var(--ts)">'+esc((m.especialidades||[]).join(', '))+'</div></div>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap">'+
        '<button class="com-btn-g" onclick="comMedToggleComision('+i+')">'+(m.comision?'Quitar comisión':'Poner comisión')+'</button>'+
        (m.comision?'<button class="com-btn-g" onclick="comMedEditar('+i+',false)">✏️ Categorías/clave</button>':'')+
        '<button class="com-btn-g" onclick="comMedActivo('+i+','+(m.activo?'false':'true')+')">'+(m.activo?'🚫 Inactivar':'✓ Reactivar')+'</button>'+
      '</div>'+
      '<div id="comMedEdit'+i+'" style="flex:1 1 100%"></div>'+
    '</div>';
  }).join('') || '<div class="empty">No hay médicos.</div>';
  document.getElementById('comAdminBody').innerHTML = top + '<div class="com-sub-t" style="margin-top:6px">Médicos ('+COM_MEDS.length+')</div>' + lst;
}
function comMedFormNuevo(){
  var c = document.getElementById('comMedForm'); if (!c) return;
  var st = 'width:100%;margin-bottom:6px;border:1.5px solid var(--bd);border-radius:9px;padding:9px;font-family:inherit';
  c.innerHTML = '<div class="card" style="margin:8px 0;padding:12px;background:var(--pl)">'+
    '<div class="com-sub-t">Agregar médico</div>'+
    '<input id="mnNombre" placeholder="Nombre (ej. Dra. Juana Pérez)" style="'+st+'">'+
    '<input id="mnEsp" placeholder="Especialidad (ej. Dermatología)" style="'+st+'">'+
    '<input id="mnTel" inputmode="numeric" placeholder="WhatsApp 57..." style="'+st+'">'+
    '<div style="display:flex;gap:8px"><button class="com-btn-g" onclick="document.getElementById(\'comMedForm\').innerHTML=\'\'">Cancelar</button><button class="com-btn-p" onclick="comMedGuardarNuevo()">Guardar</button></div>'+
    '<div class="com-err" id="mnErr"></div></div>';
}
function comMedGuardarNuevo(){
  var nombre = (document.getElementById('mnNombre')||{}).value || '';
  var esp = (document.getElementById('mnEsp')||{}).value || '';
  var tel = (document.getElementById('mnTel')||{}).value || '';
  var err = document.getElementById('mnErr');
  if (!nombre.trim() || !esp.trim()) { err.textContent = 'Nombre y especialidad son obligatorios.'; return; }
  err.textContent = 'Guardando…';
  comPost({ action:'medAdminGuardar', token:COM_ADMIN.token, nombre:nombre, especialidad:esp, telefono:tel }).then(function(r){
    if (r && r.needLogin) { comAdminSet(null); comAdminLockUI('Sesión vencida.'); return; }
    if (!r || !r.ok) { err.textContent = (r && r.error) || 'No se pudo.'; return; }
    comAdminMedicos();
  }).catch(function(){ err.textContent = 'Error de conexión.'; });
}
function comMedActivo(i, activar){
  var m = COM_MEDS[i]; if (!m) return;
  if (!activar && !confirm('¿Inactivar a ' + m.medico + '? Se saca de la app pero se conserva su historial. Es reversible.')) return;
  comPost({ action:'medAdminActivo', token:COM_ADMIN.token, nombre:m.medico, activo:activar?'si':'no' }).then(function(r){
    if (r && r.needLogin) { comAdminSet(null); comAdminLockUI('Sesión vencida.'); return; }
    comAdminMedicos();
  });
}
function comMedToggleComision(i){
  var m = COM_MEDS[i]; if (!m) return;
  if (!m.comision) { comMedEditar(i, true); return; }   // al ENCENDER, abre el editor
  if (!confirm('¿Quitarle la comisión a ' + m.medico + '? No podrá entrar a su perfil de comisiones.')) return;
  comPost({ action:'medAdminComision', token:COM_ADMIN.token, nombre:m.medico, comision:'no' }).then(function(r){
    if (r && r.needLogin) { comAdminSet(null); comAdminLockUI('Sesión vencida.'); return; }
    comAdminMedicos();
  });
}
function comMedEditar(i, encender){
  var m = COM_MEDS[i]; if (!m) return;
  comMedI = i; comMedEnc = !!encender;
  var base = (m.cats && m.cats.length) ? m.cats : COM_CATSDEF;
  comMedCats = base.map(function(c){ return { key:c.key||'', label:c.label||'', pct:Number(c.pct)||0 }; });
  comMedEditRender();
}
function comMedEditRender(){
  var cont = document.getElementById('comMedEdit'+comMedI); if (!cont) return;
  var st = 'border:1.5px solid var(--bd);border-radius:8px;padding:7px;font-family:inherit';
  var rows = comMedCats.map(function(c,j){
    return '<div style="display:flex;gap:6px;margin-bottom:5px;align-items:center">'+
      '<input value="'+esc(c.label||'')+'" placeholder="Categoría" oninput="comMedCatUpd('+j+',\'label\',this.value)" style="flex:1;min-width:0;'+st+'">'+
      '<input type="number" inputmode="numeric" value="'+(c.pct||0)+'" oninput="comMedCatUpd('+j+',\'pct\',this.value)" style="width:64px;'+st+'"><span style="font-weight:700">%</span>'+
      '<button class="com-btn-g" onclick="comMedCatDel('+j+')">✕</button></div>';
  }).join('');
  var m = COM_MEDS[comMedI];
  var pideClave = comMedEnc || !m.tieneClave;
  cont.innerHTML = '<div class="card" style="margin:6px 0;padding:12px;background:var(--pl)">'+
    '<div class="com-sub-t">Categorías y % de '+esc(m.medico)+'</div>'+ rows +
    '<button class="com-btn-g" onclick="comMedCatAdd()" style="width:100%;margin:4px 0">＋ Agregar categoría</button>'+
    (pideClave?'<div style="margin-top:8px"><label style="font-size:.72rem;color:var(--tm);font-weight:700">Clave temporal (4 díg'+(m.tieneClave?', opcional':'')+')</label>'+
      '<input id="comMedClave'+comMedI+'" inputmode="numeric" maxlength="4" placeholder="••••" oninput="this.value=this.value.replace(/\\D/g,\'\').slice(0,4)" style="width:100%;'+st+';text-align:center;letter-spacing:.3em;font-size:1.1rem"></div>':'')+
    '<div style="display:flex;gap:8px;margin-top:10px"><button class="com-btn-g" onclick="document.getElementById(\'comMedEdit'+comMedI+'\').innerHTML=\'\'">Cancelar</button><button class="com-btn-p" onclick="comMedGuardarComision()">Guardar</button></div>'+
    '<div class="com-err" id="comMedErr'+comMedI+'"></div></div>';
}
function comMedCatUpd(j,f,v){ if (!comMedCats[j]) return; comMedCats[j][f] = (f==='pct') ? (Number(v)||0) : v; }
function comMedCatDel(j){ comMedCats.splice(j,1); comMedEditRender(); }
function comMedCatAdd(){ comMedCats.push({ key:'', label:'', pct:0 }); comMedEditRender(); }
function comMedGuardarComision(){
  var m = COM_MEDS[comMedI]; if (!m) return;
  var err = document.getElementById('comMedErr'+comMedI);
  var cats = comMedCats.filter(function(c){ return String(c.label||'').trim(); })
    .map(function(c){ return { key:c.key||'', label:String(c.label).trim(), pct:Number(c.pct)||0 }; });
  if (!cats.length) { if (err) err.textContent = 'Agregue al menos una categoría.'; return; }
  var clEl = document.getElementById('comMedClave'+comMedI);
  var clave = clEl ? String(clEl.value||'').replace(/\D/g,'') : '';
  if (!m.tieneClave && clave.length !== 4) { if (err) err.textContent = 'Ponga una clave temporal de 4 dígitos para este médico.'; return; }
  var payload = { action:'medAdminComision', token:COM_ADMIN.token, nombre:m.medico, comision:'si', cats:cats };
  if (clave.length === 4) payload.clave = clave;
  if (err) err.textContent = 'Guardando…';
  comPost(payload).then(function(r){
    if (r && r.needLogin) { comAdminSet(null); comAdminLockUI('Sesión vencida.'); return; }
    if (!r || !r.ok) { if (err) err.textContent = (r && r.error) || 'No se pudo.'; return; }
    comAdminMedicos();
  }).catch(function(){ if (err) err.textContent = 'Error de conexión.'; });
}

comAdminInit();
</script>
